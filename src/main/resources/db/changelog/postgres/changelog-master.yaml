databaseChangeLog:
  - changeSet:
      id: 1-create-schema
      author: mbeltran93
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ";"
            sql: |
              CREATE TABLE users (
                  id BIGSERIAL PRIMARY KEY,
                  name VARCHAR(120) NOT NULL,
                  email VARCHAR(160) NOT NULL UNIQUE,
                  password_hash VARCHAR(255) NOT NULL,
                  created_at TIMESTAMP NOT NULL DEFAULT now()
              );

              CREATE TABLE projects (
                  id BIGSERIAL PRIMARY KEY,
                  name VARCHAR(160) NOT NULL,
                  description VARCHAR(2000),
                  owner_id BIGINT NOT NULL REFERENCES users(id),
                  created_at TIMESTAMP NOT NULL DEFAULT now()
              );

              CREATE TABLE tasks (
                  id BIGSERIAL PRIMARY KEY,
                  title VARCHAR(200) NOT NULL,
                  description VARCHAR(2000),
                  status VARCHAR(20) NOT NULL DEFAULT 'TODO',
                  project_id BIGINT NOT NULL REFERENCES projects(id),
                  assignee_id BIGINT REFERENCES users(id),
                  due_date DATE,
                  created_at TIMESTAMP NOT NULL DEFAULT now()
              );

              CREATE INDEX idx_projects_owner_id ON projects(owner_id);
              CREATE INDEX idx_tasks_project_id ON tasks(project_id);
              CREATE INDEX idx_tasks_assignee_id ON tasks(assignee_id);
      rollback:
        - sql:
            sql: DROP TABLE tasks; DROP TABLE projects; DROP TABLE users;

  - changeSet:
      id: 2-idx-tasks-project-status
      author: mbeltran93
      comment: >
        Indice compuesto para el filtro GET /api/projects/{id}/tasks?status=,
        que hace WHERE project_id = ? AND status = ?. Antes de este indice,
        Postgres usaba el indice de una sola columna idx_tasks_project_id y
        despues filtraba status en memoria (Bitmap Heap Scan + Filter); con
        este indice compuesto el filtro de status entra en el Index Cond, no
        en un Filter posterior. Planes reales antes/despues en la seccion
        "Tuning de performance" del README.
      changes:
        - sql:
            sql: CREATE INDEX idx_tasks_project_status ON tasks(project_id, status);
      rollback:
        - sql:
            sql: DROP INDEX idx_tasks_project_status;
