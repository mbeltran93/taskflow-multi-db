databaseChangeLog:
  - changeSet:
      id: 1-create-schema
      author: mbeltran93
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ";"
            sql: |
              CREATE TABLE users (
                  id NUMBER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  name VARCHAR2(120) NOT NULL,
                  email VARCHAR2(160) NOT NULL UNIQUE,
                  password_hash VARCHAR2(255) NOT NULL,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL
              );

              CREATE TABLE projects (
                  id NUMBER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  name VARCHAR2(160) NOT NULL,
                  description VARCHAR2(2000),
                  owner_id NUMBER NOT NULL,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
                  CONSTRAINT fk_projects_owner FOREIGN KEY (owner_id) REFERENCES users(id)
              );

              CREATE TABLE tasks (
                  id NUMBER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  title VARCHAR2(200) NOT NULL,
                  description VARCHAR2(2000),
                  status VARCHAR2(20) DEFAULT 'TODO' NOT NULL,
                  project_id NUMBER NOT NULL,
                  assignee_id NUMBER,
                  due_date DATE,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT SYSTIMESTAMP NOT NULL,
                  CONSTRAINT fk_tasks_project FOREIGN KEY (project_id) REFERENCES projects(id),
                  CONSTRAINT fk_tasks_assignee FOREIGN KEY (assignee_id) REFERENCES users(id)
              );

              CREATE INDEX idx_projects_owner_id ON projects(owner_id);
              CREATE INDEX idx_tasks_project_id ON tasks(project_id);
              CREATE INDEX idx_tasks_assignee_id ON tasks(assignee_id);
      rollback:
        - sql:
            sql: DROP TABLE tasks; DROP TABLE projects; DROP TABLE users;

  - changeSet:
      id: 2-close-project-procedure
      author: mbeltran93
      comment: >
        PL/SQL: cierra un proyecto marcando como DONE todas las tareas que no
        lo estaban, y devuelve en un OUT param cuantas filas se actualizaron.
        Se llama desde OracleProjectCloser (SimpleJdbcCall) en el endpoint
        POST /api/projects/{id}/close.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE PROCEDURE close_project (
                  p_project_id     IN  NUMBER,
                  p_updated_count  OUT NUMBER
              ) IS
              BEGIN
                  UPDATE tasks
                     SET status = 'DONE'
                   WHERE project_id = p_project_id
                     AND status <> 'DONE';

                  p_updated_count := SQL%ROWCOUNT;
              END close_project;
      rollback:
        - sql:
            sql: DROP PROCEDURE close_project;

  - changeSet:
      id: 3-idx-tasks-project-status
      author: mbeltran93
      comment: >
        Indice compuesto para el filtro GET /api/projects/{id}/tasks?status=,
        que hace WHERE project_id = ? AND status = ?. Ver seccion "Tuning de
        performance" del README para el plan de ejecucion antes/despues.
      changes:
        - sql:
            sql: CREATE INDEX idx_tasks_project_status ON tasks(project_id, status);
      rollback:
        - sql:
            sql: DROP INDEX idx_tasks_project_status;
