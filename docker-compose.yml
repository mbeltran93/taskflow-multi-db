services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    container_name: taskflow-mysql
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: taskflow
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  # SQL Server no crea una base de datos propia al arrancar (solo "master").
  # Hay que crear la base "taskflow" a mano una vez levantado el contenedor;
  # el comando exacto esta documentado en el README.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TaskflowStrong!Passw0rd"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  # gvenzl/oracle-free crea automaticamente el usuario/schema APP_USER en la
  # pluggable database FREEPDB1 la primera vez que arranca. El primer arranque
  # puede tardar varios minutos mientras inicializa los datafiles.
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: taskflow-oracle
    environment:
      ORACLE_PASSWORD: taskflow
      APP_USER: taskflow
      APP_USER_PASSWORD: taskflow
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  postgres_data:
  mysql_data:
  sqlserver_data:
  oracle_data:
