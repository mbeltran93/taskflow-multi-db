name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Postgres y MySQL son los 2 motores que corren en CI: las clases
  # PostgresCrudIT / MySqlCrudIT ya administran su propio contenedor real via
  # Testcontainers (ver src/test/java/com/taskflow/multidb), y los runners de
  # GitHub Actions para Ubuntu traen Docker preinstalado y funcionando, asi que
  # Testcontainers corre ahi sin el problema de Docker Desktop para Windows
  # documentado en el README (el named pipe que le da a Testcontainers una
  # respuesta "stub"). Por eso este job NO usa el bloque "services:" de
  # Actions para levantar Postgres/MySQL (seria un contenedor de mas, sin
  # usar): el propio test ya levanta y destruye el suyo.
  test-postgres-mysql:
    name: Tests de integracion (Postgres + MySQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Tests de integracion (Testcontainers real, no mocks) contra Postgres y MySQL
        run: mvn -B verify -Dit.test=PostgresCrudIT,MySqlCrudIT

      # SQL Server y Oracle NO corren en este CI: las imagenes son mucho mas
      # pesadas (mssql-server ronda el GB, oracle-free varios GB mas un
      # arranque de varios minutos para inicializar datafiles) y harian el
      # pipeline lento y caro para un repo de portafolio. Las clases
      # SqlServerCrudIT/OracleCrudIT existen con el mismo codigo y quedan con
      # @Disabled a proposito (ver README); ambas se verificaron igual, pero
      # a mano con "docker compose up" + curl contra contenedores reales,
      # documentado con el detalle real en el README ("Que se probo
      # realmente").

  codeql:
    name: CodeQL (analisis estatico de Java)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Compilar el proyecto (autobuild)
        uses: github/codeql-action/autobuild@v3

      - name: Analisis CodeQL
        uses: github/codeql-action/analyze@v3
